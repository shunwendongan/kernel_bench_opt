<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc"><title id="title">三级评测：从算子正确到业务收益</title><desc id="desc">L1算子、L2模块与子图、L3完整请求分别检验正确性与性能；失败和退化同样归档。</desc><defs>
  <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".7" fill="#34414B" opacity=".055"/></pattern>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><path d="M0 0V8" stroke="#34414B" stroke-width="1" opacity=".12"/></pattern>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#34414B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs><rect width="1280" height="660" rx="20" fill="#FCFBF7"/><rect width="1280" height="660" rx="20" fill="url(#paper)"/>
  <style>text{font-family:'Kaiti SC','STKaiti','KaiTi','Noto Sans CJK SC','PingFang SC',sans-serif;fill:#34414B}.title{font-size:32px;font-weight:700}.body{font-size:26px}.small{font-size:22px}.label{font-size:29px;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:21px}</style><circle cx="57" cy="56" r="22" fill="#E5F1FA" stroke="#34414B" stroke-width="2.3"/><text x="57" y="64" class="small" text-anchor="middle">04</text><text x="94" y="65" class="title" text-anchor="start">三个尺度，回答三个不同的问题</text><text x="49" y="108" class="small" text-anchor="start">先过正确性，再比较同口径性能；局部变快不直接等于业务收益</text><path d="M49 124Q420 127 1225 123" fill="none" stroke="#C6C8C4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M71 396Q221 394 374 397L370 474H75Z" fill="#E5F1FA"/><path d="M71 397Q223 394 373 396" fill="none" stroke="#5AA7D8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="106" cy="338" r="30" fill="#E5F1FA" stroke="#5AA7D8" stroke-width="2.3"/><text x="106" y="347" class="label" text-anchor="middle">L1</text><text x="157" y="347" class="label" text-anchor="start">算子</text><path d="M92 416l14 13 24-30" fill="none" stroke="#5AA7D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M481 346Q631 344 784 347L780 474H485Z" fill="#F0EAF7"/><path d="M481 347Q633 344 783 346" fill="none" stroke="#9D86BD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="516" cy="288" r="30" fill="#F0EAF7" stroke="#9D86BD" stroke-width="2.3"/><text x="516" y="297" class="label" text-anchor="middle">L2</text><text x="567" y="297" class="label" text-anchor="start">子图 / 模块</text><path d="M502 366l14 13 24-30" fill="none" stroke="#9D86BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M890 296Q1040 294 1193 297L1189 474H894Z" fill="#E5F2EA"/><path d="M890 297Q1042 294 1192 296" fill="none" stroke="#58A483" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="925" cy="238" r="30" fill="#E5F2EA" stroke="#58A483" stroke-width="2.3"/><text x="925" y="247" class="label" text-anchor="middle">L3</text><text x="976" y="247" class="label" text-anchor="start">完整请求</text><path d="M911 316l14 13 24-30" fill="none" stroke="#58A483" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M385 342Q432 342 463 297" fill="none" stroke="#34414B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M796 292Q841 291 873 247" fill="none" stroke="#34414B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="222" y="220" class="body" text-anchor="middle">同输入 · 同权重</text><text x="222" y="255" class="body" text-anchor="middle">真实 shape 对拍</text><text x="632" y="174" class="body" text-anchor="middle">相同模块输入</text><text x="632" y="209" class="body" text-anchor="middle">检查接线与整体输出</text><text x="1041" y="181" class="small" text-anchor="middle">同工作量 · 干净计时</text><text x="223" y="440" class="small" text-anchor="middle">驻留算子延迟 / 传输口径</text><text x="633" y="393" class="small" text-anchor="middle">模块输出 / 集成成本</text><text x="1042" y="343" class="small" text-anchor="middle">请求延迟 / 首响应 / 吞吐</text><path d="M90 494H1188" fill="none" stroke="#34414B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 536 Q342.5 533 580 536 Q593 535 591 546 L590 599 Q592 611 580 610 L105 609 Q93 611 94 599 L95 546 Q94 535 105 536Z" fill="#E5F2EA" stroke="#58A483" stroke-width="2.3"/><path d="M103 614Q342.5 616 583 613" fill="none" stroke="#58A483" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="581" class="body" text-anchor="middle">通过 → 记录收益与适用范围</text><path d="M699 536 Q936.5 533 1174 536 Q1187 535 1185 546 L1184 599 Q1186 611 1174 610 L699 609 Q687 611 688 599 L689 546 Q688 535 699 536Z" fill="#FCECE5" stroke="#E78C75" stroke-width="2.3"/><path d="M697 614Q936.5 616 1177 613" fill="none" stroke="#E78C75" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="936" y="581" class="body" text-anchor="middle">失败 / 退化 → 保留原因与证据</text></svg>